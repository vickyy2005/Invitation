<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .gold-line {
        fill: none;
        stroke: #c8a346;
        stroke-width: 0.9;
        stroke-opacity: 0.22;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .gold-fill {
        fill: #d4af37;
        fill-opacity: 0.12;
      }
      .gold-accent {
        fill: #d4af37;
        fill-opacity: 0.28;
      }
    </style>
  </defs>

  <!-- Center Mandala Flower Motif -->
  <g transform="translate(60, 60)">
    <!-- Outer Petal Rings -->
    <circle cx="0" cy="0" r="28" class="gold-line" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="16" class="gold-line"/>
    <circle cx="0" cy="0" r="5" class="gold-fill"/>
    <circle cx="0" cy="0" r="2" class="gold-accent"/>
    
    <!-- 8 Petals radiating -->
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line"/>
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line" transform="rotate(45)"/>
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line" transform="rotate(90)"/>
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line" transform="rotate(135)"/>
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line" transform="rotate(180)"/>
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line" transform="rotate(225)"/>
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line" transform="rotate(270)"/>
    <path d="M 0,-5 C 5,-14 9,-22 0,-28 C -9,-22 -5,-14 0,-5 Z" class="gold-line" transform="rotate(315)"/>

    <!-- Small dots at petal tips -->
    <circle cx="0" cy="-32" r="1.5" class="gold-accent"/>
    <circle cx="22.6" cy="-22.6" r="1.5" class="gold-accent"/>
    <circle cx="32" cy="0" r="1.5" class="gold-accent"/>
    <circle cx="22.6" cy="22.6" r="1.5" class="gold-accent"/>
    <circle cx="0" cy="32" r="1.5" class="gold-accent"/>
    <circle cx="-22.6" cy="22.6" r="1.5" class="gold-accent"/>
    <circle cx="-32" cy="0" r="1.5" class="gold-accent"/>
    <circle cx="-22.6" cy="-22.6" r="1.5" class="gold-accent"/>
  </g>

  <!-- Corner Flourish Elements (Creates seamless join across tiles) -->
  <!-- Top Left -->
  <g transform="translate(0, 0)">
    <circle cx="0" cy="0" r="24" class="gold-line" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="14" class="gold-line"/>
    <path d="M 0,0 C 7,8 14,14 24,14 C 14,24 8,14 0,0 Z" class="gold-fill"/>
    <path d="M 0,18 C 10,18 18,10 18,0" class="gold-line"/>
    <path d="M 0,30 C 18,30 30,18 30,0" class="gold-line"/>
  </g>

  <!-- Top Right -->
  <g transform="translate(120, 0)">
    <circle cx="0" cy="0" r="24" class="gold-line" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="14" class="gold-line"/>
    <path d="M 0,0 C -7,8 -14,14 -24,14 C -14,24 -8,14 0,0 Z" class="gold-fill"/>
    <path d="M 0,18 C -10,18 -18,10 -18,0" class="gold-line"/>
    <path d="M 0,30 C -18,30 -30,18 -30,0" class="gold-line"/>
  </g>

  <!-- Bottom Left -->
  <g transform="translate(0, 120)">
    <circle cx="0" cy="0" r="24" class="gold-line" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="14" class="gold-line"/>
    <path d="M 0,0 C 7,-8 14,-14 24,-14 C 14,-24 8,-14 0,0 Z" class="gold-fill"/>
    <path d="M 0,-18 C 10,-18 18,-10 18,0" class="gold-line"/>
    <path d="M 0,-30 C 18,-30 30,-18 30,0" class="gold-line"/>
  </g>

  <!-- Bottom Right -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="24" class="gold-line" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="14" class="gold-line"/>
    <path d="M 0,0 C -7,-8 -14,-14 -24,-14 C -14,-24 -8,-14 0,0 Z" class="gold-fill"/>
    <path d="M 0,-18 C -10,-18 -18,-10 -18,0" class="gold-line"/>
    <path d="M 0,-30 C -18,-30 -30,-18 -30,0" class="gold-line"/>
  </g>

  <!-- Connecting Vines & Tendrils -->
  <path d="M 28,60 Q 42,42 60,28" class="gold-line"/>
  <path d="M 92,60 Q 78,42 60,28" class="gold-line"/>
  <path d="M 28,60 Q 42,78 60,92" class="gold-line"/>
  <path d="M 92,60 Q 78,78 60,92" class="gold-line"/>

  <!-- Tiny leaf pairs on vines -->
  <ellipse cx="44" cy="44" rx="3" ry="1.5" transform="rotate(-45 44 44)" class="gold-fill"/>
  <ellipse cx="76" cy="44" rx="3" ry="1.5" transform="rotate(45 76 44)" class="gold-fill"/>
  <ellipse cx="44" cy="76" rx="3" ry="1.5" transform="rotate(45 44 76)" class="gold-fill"/>
  <ellipse cx="76" cy="76" rx="3" ry="1.5" transform="rotate(-45 76 76)" class="gold-fill"/>
</svg>
